[build]
  publish = "."
  functions = "netlify/functions"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

[functions]
  node_bundler = "esbuild"

[functions."syncTraktAccount"]
  timeout = 120

[functions."syncNextEpisodes"]
  timeout = 120

# Daily cron (06:00 UTC). Must be a separate function from the HTTP
# manual trigger — Netlify scheduled functions are not URL-invokable.
# Background variant allows longer than the 30s scheduled sync limit.
[functions."syncNextEpisodes-background"]
  schedule = "0 6 * * *"

