[build]
  publish = "."
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Icons keep their names (manifest), so cache for a week only.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# Rename the font file if it ever changes.
[[headers]]
  for = "/css/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# App code keeps its file names between releases, so always revalidate.
[[headers]]
  for = "/src/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/css/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/components/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

[functions]
  node_bundler = "esbuild"

[functions."syncTraktAccount"]
  timeout = 120

[functions."syncNextEpisodes"]
  timeout = 120

# Daily cron (06:00 UTC). Must be a separate function from the HTTP
# manual trigger — Netlify scheduled functions are not URL-invokable.
# Background variant allows longer than the 30s scheduled sync limit.
[functions."syncNextEpisodes-background"]
  schedule = "0 6 * * *"

# Every 30 min: push when episodes.first_aired just passed
# (My Shows countdown → phone notification).
[functions."notifyAiredEpisodes-background"]
  schedule = "*/30 * * * *"

